<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Responsive harness</title>
  <style>
    body { margin: 0; background: #333; display: flex; gap: 24px; padding: 24px; font-family: sans-serif; }
    .frame-wrap { color: #fff; font-size: 12px; }
    iframe { display: block; border: 0; background: #171B1A; }
    .w320 iframe { width: 320px; height: 720px; }
    .w390 iframe { width: 390px; height: 844px; }
    .w768 iframe { width: 768px; height: 900px; }
  </style>
</head>
<body>
  <div class="frame-wrap w320"><div>320</div><iframe id="f320" src="index.html"></iframe></div>
  <div class="frame-wrap w390"><div>390</div><iframe id="f390" src="index.html"></iframe></div>
  <div class="frame-wrap w768"><div>768</div><iframe id="f768" src="index.html"></iframe></div>
</body>
</html>
